spring.application.name=HCLCapstoneBE
server.port=8080

# Database (Supabase - Transaction Pooler)
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres
spring.datasource.username=postgres.pkbwoortbtsvbcggybia
spring.datasource.password=${DB_PASSWORD:HCLCapstone123456}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.initialization-fail-timeout=0

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:hcl-capstone-super-secret-jwt-key-2024}
jwt.expiration=86400000

# Supabase Storage
supabase.url=${SUPABASE_URL:https://pkbwoortbtsvbcggybia.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:your-service-role-key-here}

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Uploads — matches the documented 10MB per-file limit (batch endpoint allows up to 10 files)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=110MB
